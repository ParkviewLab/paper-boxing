# What this repository publishes, and where it differs from the handbook's
# release parts (dev-tools' assemble-workflows --check; see the handbook's
# ci.md, "`release.yml` — on `v*` tag push").
targets = ["docker"]
dev = false
header = """# SPDX-FileCopyrightText: 2026 Gary Frattarola <garyf@parkviewlab.ai>
#
# SPDX-License-Identifier: MIT OR Apache-2.0

"""

# The three-image matrix: one Dockerfile with a target per component, built
# as a matrix leg per component, each with its own cache scope and its own
# image name, since docker-compose.yml pulls
# ghcr.io/parkviewlab/paper-boxing-<component>, not the part's one image per
# repository. Documented in docs/decisions.md ("images on GHCR only" and "one
# distribution and one Dockerfile with three targets") and in the comment at
# the docker job in release.yml.
[[slots]]
job = "docker"
reason = "documented in docs/decisions.md and the comment at the docker job"
