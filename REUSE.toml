# REUSE annotations for files that can't carry a comment header (dotfiles, the
# version pin, the lockfile). Everything else has a per-file SPDX header.
# paper-boxing is uniformly licensed `MIT OR Apache-2.0`.
# Verify: uvx --from "reuse[charset-normalizer]" reuse lint
version = 1

SPDX-PackageName = "paper-boxing"
SPDX-PackageSupplier = "Gary Frattarola <garyf@parkviewlab.ai>"

[[annotations]]
path = [".gitignore", ".dockerignore", ".python-version", ".env.example", "tests/integration/integration.env", "uv.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The ParkviewLab mark is vendored from the handbook's brand/logos and keeps its
# all-rights-reserved tag; it is not covered by the repository's dual licence.
[[annotations]]
path = ["src/paper_boxing/frontend/brand/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"
