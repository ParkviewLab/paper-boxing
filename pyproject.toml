[project]
name = "paper-boxing"
version = "0.1.1.dev0"
description = "A small local site manager for a home lab: static sites on the LAN, a web UI for people, an MCP server for agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Gary Frattarola", email = "garyf@parkviewlab.ai" }]
# Core: what `paper_boxing.common` needs (the schemas and the REST client).
# Each image installs its own extra on top; see docs/architecture.md, "The package
# and the images".
dependencies = [
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
backend = [
    "fastapi",
    "uvicorn[standard]",
    "starlette>=1.3.1",
    "argon2-cffi",
]
frontend = [
    "nicegui",
    "httpx",
]
mcp = [
    "mcp[cli]>=1.29,<2",
    "fastapi",
    "uvicorn[standard]",
    "starlette>=1.3.1",
    "httpx",
]

[project.scripts]
paper-boxing-backend = "paper_boxing.backend.__main__:main"
paper-boxing-frontend = "paper_boxing.frontend.__main__:main"
paper-boxing-mcp = "paper_boxing.mcp.__main__:main"

[dependency-groups]
# The dev group pulls in all three extras so a plain `uv sync` gives a
# worktree everything the tests import (the fake backend needs FastAPI, the
# MCP tests need the SDK, the frontend tests NiceGUI).
dev = [
    "paper-boxing[backend,frontend,mcp]",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "ty",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_boxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The NiceGUI main file that nicegui.testing's `user` fixture executes per frontend test.
main_file = "tests/frontend_main.py"
markers = [
    "network: tests that require outbound network access",
    "integration: end-to-end tests against the running compose stack",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]                     # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"
